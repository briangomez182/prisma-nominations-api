spring:
  application:
    name: prisma-nominations-api
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/nominations
    username: nominations
    password: nominations
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # el esquema lo gobierna Flyway, nunca Hibernate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
