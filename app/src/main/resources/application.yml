spring:
  application:
    name: prisma-nominations-api
  threads:
    virtual:
      enabled: true

  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false
  mvc:
    problemdetails:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/nominations
    username: nominations
    password: nominations
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # el esquema lo gobierna Flyway, nunca Hibernate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false

nominations:
  kafka:
    partitions: 6               # unidad de paralelismo de los consumers
    replication-factor: 1       # local; en producción >= 3 con min.insync.replicas=2
  outbox:
    relay:
      enabled: true
      fixed-delay: 500ms
      batch-size: 100
      send-timeout: 5s
    retention: 7d               # purga de eventos ya publicados
    purge:
      enabled: true
      fixed-delay: 1h
      initial-delay: 1m
  demo-consumer:
    enabled: true               # consumidor de ejemplo de nomination.result.v1
    group-id: notifications-demo
    max-attempts: 3             # luego, a nomination.result.v1-dlt
    backoff: 1s

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"   # correlation id (MDC, CorrelationIdFilter) en cada línea de log
