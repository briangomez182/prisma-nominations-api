spring:
  application:
    name: prisma-nominations-api
  threads:
    virtual:
      enabled: true

  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false
  mvc:
    problemdetails:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/nominations
    username: nominations
    password: nominations
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # el esquema lo gobierna Flyway, nunca Hibernate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false

nominations:
  security:
    jwt:
      # SOLO DEMO, NO PRODUCTIVO: clave HS256 (base64, >= 256 bits) conocida por scripts/mint-token.sh.
      # Sobreescribir con la variable de entorno NOMINATIONS_SECURITY_JWT_SECRET. En producción no hay clave
      # compartida: se valida contra el JWKS del IdP corporativo (spring.security.oauth2.resourceserver.jwt.issuer-uri).
      secret: ${NOMINATIONS_SECURITY_JWT_SECRET:PaMXbHK/6wehI0TgMBIYHUm7EjsB+82m10nGxpXDpYE=}
      issuer: prisma-nominations-demo   # se valida el claim iss (y exp)
  kafka:
    partitions: 6               # unidad de paralelismo de los consumers
    replication-factor: 1       # local; en producción >= 3 con min.insync.replicas=2
  outbox:
    relay:
      enabled: true
      fixed-delay: 500ms
      batch-size: 100
      send-timeout: 5s
    retention: 7d               # purga de eventos ya publicados
    purge:
      enabled: true
      fixed-delay: 1h
      initial-delay: 1m
  abm:
    # En la demo ABM es un mock dentro de la misma app. Se resuelve en cada llamada (admite ${local.server.port}).
    base-url: http://localhost:${local.server.port:${server.port:8080}}/abm-mock
    connect-timeout: 2s
    read-timeout: 2s            # < slow-call threshold (3s); peor caso capa 1: 3 × 2s + backoff ≈ 6,6s
    adapter:
      enabled: true             # consumer de nomination.requested.v1 que envía a ABM
      group-id: abm-adapter
      # Reintentos NO bloqueantes por tópicos de retry (falla técnica de ABM). Agotados → DLT + ABM_TIMEOUT.
      retry-delays: 10s,1m,5m
    sweeper:
      enabled: true
      fixed-delay: 30s
      response-sla: 15m         # PENDING_ABM más viejo que esto → ABM_TIMEOUT
      batch-size: 100
    response-consumer:
      enabled: true             # consumer de abm.responses.v1
      group-id: abm-response-processor
      max-attempts: 3
      backoff: 1s
  abm-mock:
    enabled: true               # simulador de ABM (HTTP + respuesta asincrónica por Kafka); ver docs/abm-mock.md
    response-delay: 2s          # en la vida real, minutos
    duplicate-gap: 300ms        # separación entre las dos respuestas del escenario DUP
    slow-http-delay: 10s        # demora del HTTP en el escenario SLOW (> read-timeout)
  metrics:
    db-gauges:
      cache-ttl: 15s            # nominations_open y outbox_*: no consultar la base en cada scrape
    kafka-dlt:
      enabled: true             # kafka_dlt_messages (suma de end offsets de los *-dlt)
      initial-delay: 5s
      refresh-interval: 30s
  demo-consumer:
    enabled: true               # consumidor de ejemplo de nomination.result.v1
    group-id: notifications-demo
    max-attempts: 3             # luego, a nomination.result.v1-dlt
    backoff: 1s

# Llamada HTTP a ABM: retry corto en proceso (fallas transitorias) dentro de un circuit breaker.
# El timeout lo da el read-timeout del cliente HTTP (nominations.abm.read-timeout).
resilience4j:
  retry:
    instances:
      abm:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
        retry-exceptions:
          - com.prisma.nominations.application.exception.AbmUnavailableException
        ignore-exceptions:
          - com.prisma.nominations.application.exception.AbmContractException
  circuitbreaker:
    instances:
      abm:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-duration-threshold: 3s
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
        record-exceptions:
          - com.prisma.nominations.application.exception.AbmUnavailableException
        ignore-exceptions:
          - com.prisma.nominations.application.exception.AbmContractException

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      # Detalle de componentes (DB, Kafka, circuit breaker) solo con token de operador; sin token, solo el estado.
      show-details: when-authorized
      roles: SCOPE_nominations:operate
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        nominations.resolution.time: true
  tracing:
    sampling:
      probability: 1.0          # demo; en producción, muestreo parcial (p.ej. 0.1)
    propagation:
      type: w3c                 # header traceparent en HTTP y Kafka (default de Boot, explícito por contrato)
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces   # Jaeger/collector OTLP HTTP
  health:
    circuitbreakers:
      enabled: true             # estado del circuit breaker "abm" en /actuator/health (no baja el estado general)

# Logs: texto legible por defecto (desarrollo). JSON ECS con el perfil json-logs (application-json-logs.yml) o con
# LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs; el JSON incluye las claves del MDC (correlationId, traceId, spanId).
logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"   # correlation id de negocio (MDC: CorrelationIdFilter y listeners)
    correlation: "[%X{traceId:-},%X{spanId:-}] "   # traza W3C (MDC del bridge OTel); vacío sin span activo
