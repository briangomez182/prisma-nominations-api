# CI: build + suite completa (unitarias e integración con Testcontainers) + build de la imagen.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: app/pom.xml

      # Testcontainers usa el Docker del runner (PostgreSQL y Kafka reales).
      - name: Build y tests
        run: mvn -B verify

      - name: Reportes de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: app/target/surefire-reports

      - name: Imagen Docker
        run: docker build -t prisma-nominations-api:${{ github.sha }} .
