# Prometheus de la demo: scrapea la app en Docker (app:8080) o en el host (host.docker.internal:8080).
# El target lo elige docker-compose.yml montando ops/prometheus/targets/${APP_RUNS_ON:-docker}.yml como
# /etc/prometheus-targets/app.yml: un único target por modo, así la alerta NominationsApiDown no queda disparada por
# el modo que no se usa y las métricas no se duplican.
# /actuator/prometheus queda sin token en la demo; en producción va por red interna o con credenciales de scrape.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local

rule_files:
  - /etc/prometheus/alerts.yml

# Sin Alertmanager en la demo: las alertas se ven en http://localhost:9090/alerts (y en Grafana).
# En producción: alerting.alertmanagers → Alertmanager con ruteo por severity (critical → guardia, warning → canal).

scrape_configs:
  - job_name: prisma-nominations-api
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    scrape_timeout: 10s
    file_sd_configs:
      - files: ["/etc/prometheus-targets/app.yml"]
        refresh_interval: 1m

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
