# Stack local completo: la app (prisma-nominations-api) + PostgreSQL + Kafka (KRaft, sin ZooKeeper) + Kafka UI
# y el stack de observabilidad: Jaeger (trazas OTLP), Prometheus (métricas + alertas) y Grafana (tableros).
#
# Dos modos:
#   a) Todo en Docker:     docker compose up -d --build
#   b) App en el host:     APP_RUNS_ON=host docker compose up -d postgres kafka kafka-ui jaeger prometheus grafana
#                          cd app && mvn spring-boot:run
#      APP_RUNS_ON=host hace que Prometheus scrapee host.docker.internal:8080 en vez de app:8080 (un solo target por
#      modo: si scrapeara ambos, en Docker Desktop host.docker.internal:8080 llega al puerto publicado del contenedor
#      y las métricas se duplicarían).
# URLs: API http://localhost:8080 · Grafana http://localhost:3000 (admin/admin) · Prometheus http://localhost:9090
#       Jaeger http://localhost:16686 · Kafka UI http://localhost:8081 — ver docs/observability.md
services:
  app:
    build: ./app
    image: prisma-nominations-api:local
    environment:
      # Perfiles: demo (application-demo.yml) + logs JSON ECS (application-json-logs.yml).
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo,json-logs}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nominations
      SPRING_DATASOURCE_USERNAME: nominations
      SPRING_DATASOURCE_PASSWORD: nominations
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092          # listener INTERNAL del broker
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      # SOLO DEMO: la misma clave default de application.yml / scripts/mint-token.sh. Sobreescribible desde el shell.
      NOMINATIONS_SECURITY_JWT_SECRET: ${NOMINATIONS_SECURITY_JWT_SECRET:-PaMXbHK/6wehI0TgMBIYHUm7EjsB+82m10nGxpXDpYE=}
      # El mock de ABM se llama a sí mismo por http://localhost:${local.server.port}/abm-mock (mismo contenedor).
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      jaeger:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 1g                 # el heap toma el 75% (MaxRAMPercentage en el Dockerfile)
    stop_grace_period: 30s           # server.shutdown=graceful: termina los requests en curso

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nominations
      POSTGRES_USER: nominations
      POSTGRES_PASSWORD: nominations
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nominations -d nominations"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # los tópicos los declara la app, con nombre y particiones explícitos
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "8081:8080"
    depends_on:
      kafka:
        condition: service_healthy

  # Trazas: la app exporta OTLP HTTP a http://jaeger:4318/v1/traces (en el host: localhost:4318). En memoria (demo).
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      MEMORY_MAX_TRACES: "50000"
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP

  # Métricas y alertas: scrapea /actuator/prometheus de la app. El target sale de ops/prometheus/targets/<modo>.yml:
  # docker (default, app:8080) u host (APP_RUNS_ON=host → host.docker.internal:8080).
  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle          # POST /-/reload para recargar config y reglas sin reiniciar
    volumes:
      - ./ops/prometheus:/etc/prometheus:ro
      - ./ops/prometheus/targets/${APP_RUNS_ON:-docker}.yml:/etc/prometheus-targets/app.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux; en Docker Desktop ya existe
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin          # solo demo
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/nominations.json
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"   # si el 3000 está ocupado: GRAFANA_PORT=3001 docker compose up -d
    depends_on:
      - prometheus

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
